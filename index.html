<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divya Rasania</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.11.1/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="icon" href="./favicon.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-base-900 text-base-content min-h-dvh overflow-x-hidden">
    <div class="mouse-glow" id="mouseGlow" aria-hidden="true"></div>

    <div
      class="flex items-center justify-center min-h-dvh px-5 py-10 sm:px-6 sm:py-12"
    >
      <div class="text-center w-full max-w-2xl">
        <!-- Avatar -->
        <div class="mb-6 sm:mb-8">
          <div class="avatar mx-auto">
            <div class="rounded-full w-24 sm:w-28">
              <img src="./profile.png" alt="Profile Picture" />
            </div>
          </div>
        </div>

        <!-- Name -->
        <h1
          class="text-3xl sm:text-4xl md:text-5xl font-bold mb-3 sm:mb-4 tracking-tight"
        >
          Divya Rasania
        </h1>

        <!-- Description -->
        <p
          class="text-base sm:text-lg text-base-content/75 mb-8 sm:mb-10 leading-relaxed max-w-md mx-auto px-1"
        >
          CS student building software, breaking things, and figuring out how
          they work.
        </p>

        <!-- Social Links -->
        <div
          class="flex flex-wrap justify-center gap-3 sm:gap-6 mb-10 sm:mb-12"
        >
          <!-- GitHub -->
          <a
            href="https://github.com/DivyaRasania"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-ghost btn-circle btn-md sm:btn-lg hover:bg-primary/20 min-h-11 min-w-11"
            title="GitHub"
            aria-label="GitHub"
          >
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
          </a>

          <!-- LinkedIn -->
          <a
            href="https://linkedin.com/in/divya-rasania"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-ghost btn-circle btn-md sm:btn-lg hover:bg-primary/20 min-h-11 min-w-11"
            title="LinkedIn"
            aria-label="LinkedIn"
          >
            <svg class="w-5 h-5 sm:w-6 sm:h-6" fill="currentColor" viewBox="0 0 24 24">
              <path
                d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"
              />
            </svg>
          </a>

          <!-- Email -->
          <a
            href="mailto:rasaniadivya1@gmail.com"
            class="btn btn-ghost btn-circle btn-md sm:btn-lg hover:bg-primary/20 min-h-11 min-w-11"
            title="Send Email"
            aria-label="Send Email"
          >
            <svg
              class="w-5 h-5 sm:w-6 sm:h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
              />
            </svg>
          </a>

          <!-- Resume -->
          <a
            href="./resume_latest.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="btn btn-ghost btn-circle btn-md sm:btn-lg hover:bg-primary/20 min-h-11 min-w-11"
            title="See Resume"
            aria-label="See Resume"
          >
            <svg
              class="w-5 h-5 sm:w-6 sm:h-6"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
              />
            </svg>
          </a>
        </div>

        <!-- Footer Text -->
        <p class="text-xs sm:text-sm text-base-content/50 px-2 leading-relaxed">
          CS @ IU Bloomington · always tinkering with something
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
