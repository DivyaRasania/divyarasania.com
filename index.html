<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Divya Rasania</title>
    <script>
      (() => {
        const saved = localStorage.getItem("theme");
        const theme =
          saved === "night" || saved === "winter"
            ? saved
            : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "winter"
              : "night";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="./favicon.jpg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-base-100 text-base-content min-h-dvh overflow-x-hidden">
    <div class="mouse-glow" id="mouseGlow" aria-hidden="true"></div>

    <label
      class="swap swap-rotate btn btn-ghost btn-circle fixed top-4 right-4 sm:top-5 sm:right-5 z-10 min-h-11 min-w-11"
      title="Toggle theme"
    >
      <input
        id="themeToggle"
        type="checkbox"
        class="theme-controller"
        value="winter"
        aria-label="Toggle light and dark theme"
      />
      <!-- sun (shown in dark mode / unchecked = night) -->
      <svg
        class="swap-off w-5 h-5 sm:w-6 sm:h-6 fill-current"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          d="M5.64,17l-.71.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0l.71-.71A1,1,0,0,0,5.64,17ZM5,12a1,1,0,0,0-1-1H3a1,1,0,0,0,0,2H4A1,1,0,0,0,5,12Zm7-7a1,1,0,0,0,1-1V3a1,1,0,0,0-2,0V4A1,1,0,0,0,12,5ZM5.64,7.05a1,1,0,0,0,.7.29,1,1,0,0,0,.71-.29,1,1,0,0,0,0-1.41l-.71-.71A1,1,0,0,0,4.93,6.34Zm12,.29a1,1,0,0,0,.7-.29l.71-.71a1,1,0,1,0-1.41-1.41L17,5.64a1,1,0,0,0,0,1.41A1,1,0,0,0,17.66,7.34ZM21,11H20a1,1,0,0,0,0,2h1a1,1,0,0,0,0-2Zm-9,8a1,1,0,0,0-1,1v1a1,1,0,0,0,2,0V20A1,1,0,0,0,12,19ZM18.36,17A1,1,0,0,0,17,18.36l.71.71a1,1,0,0,0,1.41,0,1,1,0,0,0,0-1.41ZM12,6.5A5.5,5.5,0,1,0,17.5,12,5.51,5.51,0,0,0,12,6.5Zm0,9A3.5,3.5,0,1,1,15.5,12,3.5,3.5,0,0,1,12,15.5Z"
        />
      </svg>
      <!-- moon (shown in light mode / checked = winter) -->
      <svg
        class="swap-on w-5 h-5 sm:w-6 sm:h-6 fill-current"
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
      >
        <path
          d="M21.64,13a1,1,0,0,0-1.05-.14,8.05,8.05,0,0,1-3.37.73A8.15,8.15,0,0,1,9.08,5.49a8.59,8.59,0,0,1,.25-2A1,1,0,0,0,8,2.36,10.14,10.14,0,1,0,22,14.05,1,1,0,0,0,21.64,13Zm-9.5,6.69A8.14,8.14,0,0,1,7.08,5.22v.27A10.15,10.15,0,0,0,17.22,15.63a9.79,9.79,0,0,0,2.1-.22A8.11,8.11,0,0,1,12.14,19.73Z"
        />
      </svg>
    </label>

    <div
      class="relative z-[1] flex items-center justify-center min-h-dvh px-5 py-10 sm:px-6 sm:py-12"
    >
      <div class="text-center w-full max-w-2xl">
        <!-- Avatar -->
        <div class="mb-6 sm:mb-8">
          <div class="avatar mx-auto">
            <div class="rounded-full w-24 sm:w-28 ring ring-primary/20 ring-offset-base-100 ring-offset-2">
              <img src="./profile.png" alt="Profile Picture" />
            </div>
          </div>
        </div>

        <!-- Name -->
        <h1
          class="text-3xl sm:text-4xl md:text-5xl font-bold mb-3 sm:mb-4 tracking-tight"
        >
          Divya Rasania
        </h1>

        <!-- Description -->
        <p
          class="text-base sm:text-lg text-base-content/75 mb-8 sm:mb-10 leading-relaxed max-w-md mx-auto px-1"
        >
          CS student building software, breaking things, and figuring out how
          they work.
        </p>

        <!-- Social Links -->
        <div
          class="grid grid-cols-2 gap-3 w-full max-w-sm mx-auto mb-10 sm:mb-12"
        >
          <!-- GitHub -->
          <a
            href="https://github.com/DivyaRasania"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn"
            title="GitHub"

            <svg
              class="w-5 h-5 shrink-0"

              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
            <span>GitHub</span>
          </a>

          <!-- LinkedIn -->
          <a
            href="https://linkedin.com/in/divya-rasania"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn"
            title="LinkedIn"
          >
            <svg
              class="w-5 h-5 shrink-0"
              fill="currentColor"
              viewBox="0 0 24 24"

            >
              <path

          </a>

          <!-- Email -->
          <a
            href="mailto:rasaniadivya1@gmail.com"
            class="action-btn"
            title="Email"
          >
            <svg
              class="w-5 h-5 shrink-0"
              fill="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"
              />
            </svg>
            <span>Email</span>
          </a>

          <!-- Resume -->
          <a
            href="./resume_latest.pdf"
            target="_blank"
            rel="noopener noreferrer"
            class="action-btn"
            title="View Resume"
          >
            <svg
              class="w-5 h-5 shrink-0"
              fill="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8l-6-6zm4.5 7H13V3.5L18.5 9zM12 10.25a1.75 1.75 0 1 1 0 3.5 1.75 1.75 0 0 1 0-3.5zM8.5 18v-.6c0-1.35 1.57-2.15 3.5-2.15s3.5.8 3.5 2.15v.6H8.5z"
              />
            </svg>
            <span>Resume</span>
          </a>
        </div>

        <!-- Footer Text -->
        <p class="text-xs sm:text-sm text-base-content/50 px-2 leading-relaxed">
          CS @ IU Bloomington · always tinkering with something
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
